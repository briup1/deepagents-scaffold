<style>
:root{

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.7;font-size:15px}
.layout{display:flex;max-width:1280px;margin:0 auto;min-height:100vh}
aside{width:290px;flex-shrink:0;padding:56px 32px 56px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line)}

.chip.status{background:var(--ok-soft);color:var(--ok);border-color:transparent}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:baseline;gap:12px;padding:10px 14px;border:none;border-left:2px solid transparent;background:none;text-align:left;cursor:pointer;font-family:inherit;font-size:14px;color:var(--sub);border-radius:0 6px 6px 0;transition:background .15s}

nav button:hover{background:#FBFAF7}
nav button.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--ink);font-weight:600}

.side-note{margin-top:40px;font-size:12px;color:var(--faint);line-height:1.6}
main{flex:1;padding:64px 56px 96px;min-width:0}
.panel{display:none}
.panel.show{display:block;animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.crumb{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}

.panel h2{font-family:'Instrument Serif','Songti SC','SimSun',serif;font-size:34px;letter-spacing:-.02em;font-weight:400;margin-bottom:8px}
.panel .lede{color:var(--sub);font-size:15px;margin-bottom:36px;max-width:680px}
.panel h3{font-size:17px;font-weight:700;margin:32px 0 14px}
.panel p{margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13.5px;margin-bottom:16px}
thead th{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);background:#FBFAF7;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}

.badge.info{background:var(--info-soft);color:var(--info)}

.ba .col{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.ba .col.after{border-color:var(--accent);background:var(--accent-soft)}

.ba ul{margin-left:18px}
.ba li{margin-bottom:8px;font-size:14px}

details.acc summary{cursor:pointer;list-style:none;padding:13px 18px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;user-select:none}
details.acc summary::before{content:'+';font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--accent);font-size:15px}
details.acc[open] summary::before{content:'−'}
details.acc .acc-body{padding:4px 18px 18px;border-top:1px solid var(--line)}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:16px 18px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;margin:12px 0;white-space:pre}
pre.code .new{color:#E8B4B3;font-weight:600}
.review{display:flex;align-items:center;gap:12px;margin:22px 0 10px}
.review .dim-name{font-weight:700;font-size:15px}
.evidence{background:#FBFAF7;border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;margin:8px 0 14px;white-space:pre-wrap;color:var(--sub)}

dl.kv .row{display:flex;border-bottom:1px solid var(--line)}
dl.kv .row:last-child{border-bottom:none}
dl.kv dt{flex-shrink:0;width:110px;padding:14px 18px;font-weight:700;font-size:13px;background:#FBFAF7;border-right:1px solid var(--line)}
dl.kv dd{padding:14px 20px;min-width:0}
.callout{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:16px 20px;margin:18px 0;font-size:14.5px}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:56px}
.pager button{flex:1;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px;cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s}
.pager button:hover{border-color:var(--accent)}

.pager button .t{font-size:14px;font-weight:600;color:var(--ink)}
.pager button.next{text-align:right}
.pager button:disabled{opacity:.35;cursor:default}

.kbd-hint{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--faint);text-align:center;margin-top:24px}
a.req-link{color:var(--info);text-decoration:none;border-bottom:1px dotted var(--info)}

  .layout{flex-direction:column}

  main{padding:40px 24px 72px}

  dl.kv .row{flex-direction:column}
  dl.kv dt{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px 18px}

</style>

const nav = document.getElementById('nav');
const main = document.getElementById('main');
let cur = 0;

sections.forEach((s,i)=>{
  const b = document.createElement('button');
  b.innerHTML = `<span class="no">${s.no}</span><span>${s.title}</span>`;
  b.onclick = ()=>show(i);
  nav.appendChild(b);

  const p = document.createElement('section');
  p.className='panel';
  p.innerHTML = `
    <div class="crumb">SEC ${s.no} / ${String(sections.length).padStart(2,'0')}</div>
    <h2>${s.title}</h2>
    <p class="lede">${s.lede}</p>
    ${s.html}
    <div class="pager">
      <button class="prev" ${i===0?'disabled':''} onclick="show(${i-1})"><span class="dir">上一节</span><span class="t">${i>0?sections[i-1].title:'—'}</span></button>
      <button class="next" ${i===sections.length-1?'disabled':''} onclick="show(${i+1})"><span class="dir">下一节</span><span class="t">${i<sections.length-1?sections[i+1].title:'—'}</span></button>
    </div>
    <div class="kbd-hint">↑ ↓ 键切换章节</div>`;
  main.appendChild(p);
});

function show(i){
  if(i<0||i>=sections.length) return;
  cur = i;
  document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('show',j===i));
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();show(cur+1);}
  if(e.key==='ArrowUp'){e.preventDefault();show(cur-1);}
});
show(0);
</script>
