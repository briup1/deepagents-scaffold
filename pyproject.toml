[project]
name = "deepagents-scaffold"
version = "0.1.0"
description = "A multi-agent project scaffold based on DeepAgents + Deer-Flow infrastructure"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=1.2.1",
    "langchain-deepseek>=1.0.1",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "langfuse>=3.4.1",
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
channels = [
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.34.0",
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]
