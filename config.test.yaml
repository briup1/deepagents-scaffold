config_version: 1
log_level: info
log_format: text
middleware_telemetry: true

models:
  - name: mock-default
    display_name: Mock Default
    use: scaffold.infra.models.mock:MockChatModel
    model: mock
    response_text: "这是一个来自 MockChatModel 的固定响应。"
    echo_user_messages: true

agent:
  max_iterations: 500
  drop_error_from_history: true

tools:
  - name: read_file
    use: scaffold.plugins.tools.code_review:read_file
  - name: list_files
    use: scaffold.plugins.tools.code_review:list_files
  - name: run_ruff
    use: scaffold.plugins.tools.code_review:run_ruff
  - name: run_pytest
    use: scaffold.plugins.tools.code_review:run_pytest
  - name: explain_symbol
    use: scaffold.plugins.tools.code_review:explain_symbol
  - name: generate_patch
    use: scaffold.plugins.tools.code_review:generate_patch
  - name: write_file
    use: scaffold.plugins.tools.code_review:write_file

tool_groups: []

skills:
  path: src/scaffold/plugins/skills
  container_path: /mnt/skills

middleware:
  items:
    - name: InputGuardrailMiddleware
      enabled: true
      kwargs:
        action: block
        patterns:
          - name: malware_creation
            pattern: "\\b(create|write|make|build|develop|generate|code)\\b[\\s\\S]{0,50}\\b(malware|virus|trojan|worm|ransomware|spyware|keylogger|rootkit)\\b"
          - name: credential_theft
            pattern: "\\b(steal|phish|harvest|extract|dump|skim|grab)\\b[\\s\\S]{0,50}\\b(password|credential|login|token|api key|secret|cookie|session)\\b"
        allow_list:
          - "\\bhow\\b[\\s\\S]{0,10}\\bdetect\\b"
    - name: ToolErrorHandlingMiddleware
      enabled: true
    - name: DynamicContextMiddleware
      enabled: true
      kwargs:
        inject_date: true
    - name: LoopDetectionMiddleware
      enabled: true
      kwargs:
        warn_threshold: 3
        hard_stop_threshold: 5

profiles:
  harness:
    - name: default
      base_system_prompt: ""
      system_prompt_suffix: ""
      excluded_middleware: []
      excluded_tools: []
    - name: coding
      base_system_prompt: "You are a coding assistant."
      system_prompt_suffix: "Write tests."
      excluded_middleware: []
      excluded_tools: []
    - name: code_reviewer
      base_system_prompt: "You are a code reviewer."
      system_prompt_suffix: "Review carefully."
      excluded_middleware: []
      excluded_tools: []
  default_harness: default

backend:
  type: filesystem
  filesystem:
    root_dir: /
  sandbox:
    provider: local
    timeout_seconds: 60
    mounts: []

memory:
  enabled: false
  storage_path: ./tmp_tests/AGENTS.md

subagents:
  enabled: false
  max_concurrent: 3
  timeout_seconds: 900

subagent_definitions:
  items: []

channels:
  langgraph_url: http://localhost:8000/api
  gateway_url: http://localhost:8000
  feishu:
    enabled: false
  slack:
    enabled: false

tracing:
  enabled: false
  providers: []

gateway:
  host: 127.0.0.1
  port: 8000
  enable_docs: false

database:
  backend: sqlite
  sqlite_dir: ./tmp_tests/data
