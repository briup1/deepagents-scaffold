# DeepAgents Scaffold - 主配置文件
# 复制此文件并根据项目需求编辑。

config_version: 1

# 日志级别：debug, info, warning, error
log_level: debug
# 日志格式：text 或 json
log_format: json
# 是否开启中间件可观测性（自动记录每个中间件 hook 进入/退出）
middleware_telemetry: true

# ---------------------------------------------------------------------------
# 模型配置
# ---------------------------------------------------------------------------
# 配置一个或多个 LLM 提供商，第一个模型为默认模型。
# 使用 $ENV_VAR 语法引用环境变量。
models:
  - name: deepseek-v4-flash
    display_name: deepseek-v4-flash
    # 方式 B：原生 DeepSeek 适配器（需要 langchain-deepseek，自动补丁推理功能）
    use: langchain_deepseek:ChatDeepSeek
    base_url: https://api.deepseek.com
    api_key: $DEEPSEEK_API_KEY
    model: deepseek-v4-flash
    supports_thinking: true
    # 若设为 true，模型调用将忽略 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY 等系统代理变量
    # bypass_proxy: false
    # temperature: 0.7
    # max_tokens: 4096
  
  - name: kimi-for-coding
    display_name: Kimi for Coding
    use: langchain_moonshot:ChatMoonshot
    base_url: https://api.kimi.com/coding/v1
    api_key: $MOONSHOT_API_KEY
    model: kimi-for-coding
    temperature: 1.0
    supports_thinking: true
    supports_vision: false

  - name: anthropic-claude-3-5-sonnet
    display_name: Claude 3.5 Sonnet
    use: langchain_anthropic:ChatAnthropic
    api_key: $ANTHROPIC_API_KEY
    model: claude-3-5-sonnet-20241022
    temperature: 0.7
    max_tokens: 4096
    supports_thinking: true
    supports_vision: true

# ---------------------------------------------------------------------------
# Agent 行为配置
# ---------------------------------------------------------------------------
agent:
  # ReAct / LangGraph 循环的最大迭代次数，达到后会抛出 GraphRecursionError 作为兜底出口
  max_iterations: 500
  # 模型返回 error finish_reason 时，是否将该响应从对话历史中剔除，防止毒消息死循环
  drop_error_from_history: true

# ---------------------------------------------------------------------------
# 工具配置
# ---------------------------------------------------------------------------
# 在此注册自定义工具，每个工具引用一个 Python 导入路径。
# 工具必须是异步可调用对象，接受关键字参数。
tools:
  - name: read_file
    use: scaffold.plugins.tools.code_review:read_file
  - name: list_files
    use: scaffold.plugins.tools.code_review:list_files
  - name: run_ruff
    use: scaffold.plugins.tools.code_review:run_ruff
  - name: run_pytest
    use: scaffold.plugins.tools.code_review:run_pytest
  - name: explain_symbol
    use: scaffold.plugins.tools.code_review:explain_symbol
  - name: render_ui
    use: scaffold.plugins.tools.generative_ui:render_ui
  - name: generate_patch
    use: scaffold.plugins.tools.code_review:generate_patch
  - name: write_file
    use: scaffold.plugins.tools.code_review:write_file
  - name: preview_excel
    use: scaffold.plugins.tools.preview_excel:preview_excel

# 工具分组，按类别组织工具并选择性启用。
tool_groups: []

# ---------------------------------------------------------------------------
# 技能配置
# ---------------------------------------------------------------------------
# 技能是定义在 plugins/skills/ 目录下 SKILL.md 文件中的可复用行为。
# 设置包含技能定义的目录路径。
skills:
  path: src/scaffold/plugins/skills
  container_path: /mnt/skills

# ---------------------------------------------------------------------------
# 中间件配置
# ---------------------------------------------------------------------------
# 声明注入到 DeepAgents agent 的有序中间件链。
# 每个条目指定一个中间件类（或别名）和可选的 kwargs。
# 内置别名：MemoryMiddleware（由 DeepAgents 根据 memory.storage_path 自动注入，无需在此声明）、
#   FilesystemMiddleware, SubAgentMiddleware, SkillsMiddleware,
#   LoopDetectionMiddleware, ToolErrorHandlingMiddleware,
#   DynamicContextMiddleware, TokenUsageMiddleware, SafetyTerminationMiddleware,
#   InputGuardrailMiddleware, TodoMiddleware, TitleMiddleware, DeepAgentsSummarizationMiddleware
middleware:
  items:
    - name: InputGuardrailMiddleware
      enabled: true
      kwargs:
        action: block
        strip_claimed_intent: true
        patterns:
          - name: malware_creation
            pattern: "\\b(create|write|make|build|develop|generate|code)\\b[\\s\\S]{0,50}\\b(malware|virus|trojan|worm|ransomware|spyware|keylogger|rootkit)\\b"
          - name: credential_theft
            pattern: "\\b(steal|phish|harvest|extract|dump|skim|grab)\\b[\\s\\S]{0,50}\\b(password|credential|login|token|api key|secret|cookie|session)\\b"
          - name: social_engineering
            pattern: "\\b(write|craft|create|draft|compose)\\b[\\s\\S]{0,50}\\b(phishing|spear.phishing|social.engineering|scam|pretexting|bait|hook)\\b"
          - name: exploit_development
            pattern: "\\b(write|create|build|develop|generate|code)\\b[\\s\\S]{0,50}\\b(exploit|payload|shellcode|reverse.shell|0day|zero.day|buffer.overflow|sql.injection)\\b"
          - name: harmful_instructions
            pattern: "\\b(how.to|steps.to|guide.for|tutorial.on)\\b[\\s\\S]{0,30}\\b(make|build|create)\\b[\\s\\S]{0,30}\\b(bomb|weapon|poison|drug|meth|explosive)\\b"
        allow_list:
          - "\\bdefend\\b[\\s\\S]{0,30}\\b(against|from)\\b"
          - "\\bhow\\b[\\s\\S]{0,10}\\bdetect\\b"
          - "\\bsecurity\\s+awareness\\b"
          - "\\bincident\\s+response\\b"
          - "\\bmitigate\\b"
        keywords: []
        message_template: "I can't help with requests that involve {matched_pattern}. If you're working on legitimate security research or defense, please rephrase your request to focus on protective or defensive measures."
    - name: ToolErrorHandlingMiddleware
      enabled: true
    - name: DynamicContextMiddleware
      enabled: true
      kwargs:
        inject_date: true
    - name: LoopDetectionMiddleware
      enabled: true
      kwargs:
        warn_threshold: 3
        hard_stop_threshold: 5
    - name: TokenUsageMiddleware
      enabled: true
      kwargs:
        log_interval: 1
    - name: TitleMiddleware
      enabled: true
      kwargs:
        max_title_length: 60

    # DeepAgents 已自动注入原生 SummarizationMiddleware（根据模型 profile 自动选择
    # trigger/keep，并带 backend offload）。如果想自定义摘要参数，请：
    #   1. 在下方 profiles.harness.<name>.excluded_middleware 中加入
    #      "SummarizationMiddleware" 以排除默认版本；
    #   2. 取消注释下面的 DeepAgentsSummarizationMiddleware 并调整 kwargs。
    # - name: DeepAgentsSummarizationMiddleware
    #   enabled: true
    #   kwargs:
    #     model_name: null
    #     trigger:
    #       - ["messages", 30]
    #     keep: ["messages", 5]
    #     summary_prompt: null
    #     trim_tokens_to_summarize: 4000
    #     token_counter: null
    # 韧性中间件（模型重试、工具重试、模型回退）
    # 按需取消注释并调整 fallback_models 为你的实际模型名称。
    # - name: ModelFallbackMiddleware
    #   enabled: true
    #   kwargs:
    #     models: $config.models
    #     fallback_models:
    #       - fallback-model-name
    # - name: ModelRetryMiddleware
    #   enabled: true
    #   kwargs:
    #     max_retries: 2
    #     backoff_factor: 2.0
    #     initial_delay: 1.0
    #     max_delay: 60.0
    #     jitter: true
    #     retry_on_status_codes: [429, 502, 503, 504]
    # - name: ToolRetryMiddleware
    #   enabled: true
    #   kwargs:
    #     max_retries: 1
    #     backoff_factor: 2.0
    #     initial_delay: 1.0
    #     max_delay: 60.0
    #     jitter: true
    #     retry_on_status_codes: [429, 502, 503, 504]

# ---------------------------------------------------------------------------
# 配置画像
# ---------------------------------------------------------------------------
# Harness 画像根据使用场景自定义 agent 行为。
#   base_system_prompt: 替换 BASE 提示词段（为空则使用默认模板）
#   system_prompt_suffix: 追加到 BASE 之后
#   excluded_middleware: 要跳过的中间件名称
#   excluded_tools: 要移除的工具名称
profiles:
  harness:
    - name: default
      base_system_prompt: ""
      system_prompt_suffix: |
        你可以调用 render_ui(type, props, surface_id) 工具向前端渲染交互式组件。可用组件：
        - markdown_card: title（可选）, content
        - data_table: title（可选）, columns: [{key: string, label: string}], rows: [{key: 值}], 例如 {"columns":[{"key":"name","label":"姓名"},{"key":"age","label":"年龄"}],"rows":[{"name":"Alice","age":30}]}
        - form: title（可选）, fields: [{name, label, type?: "text" | "number"}], submitLabel（可选）
        - button_group: title（可选）, buttons: [{id, label}]，例如 {"title":"操作","buttons":[{"id":"view_details","label":"查看详细报告"}]}
        - metric_card: title（可选）, value: number, unit（可选）, change（可选）: number（如 12 表示 +12%，不要带 % 号）
        - chart: title（可选）, kind: "bar" | "line", data: [{label: string, value: number}], width（可选）: number, height（可选）: number
        当需要展示结构化数据、收集用户输入或提供可点击选项时，优先调用 render_ui 而不是纯文本。
        如需更新已有组件，请复用相同的 surface_id。
        用户通过可交互组件发回的动作格式为：
        - form_submit: { type: "form_submit", surfaceId?, values: {字段名: 输入值} }
        - button_click: { type: "button_click", surfaceId?, id: 按钮ID }
        收到动作后，根据上下文再次调用 render_ui 更新界面。
      excluded_middleware: []
      excluded_tools: []
    - name: coding
      base_system_prompt: "你是一名资深软件工程师，你叫紫云，擅长编写高质量代码。"
      system_prompt_suffix: "请始终遵循最佳实践并编写单元测试。"
      excluded_middleware: []
      excluded_tools: []
    - name: code_reviewer
      base_system_prompt: "你是一名结对代码审查员。你的目标是通过读取代码、运行静态分析和测试、委派子 Agent，帮助用户发现质量问题并生成改进方案。"
      system_prompt_suffix: "请使用 Markdown 输出结构化的审查报告。在应用 patch 前，默认先询问用户确认；如果用户明确说'直接改'或'应用 patch'，则可以跳过确认。禁止写入 .env、config.yaml、密钥文件以及 core/infra/api/runtime/ 目录。"
      excluded_middleware: []
      excluded_tools: []
  default_harness: code_reviewer

# ---------------------------------------------------------------------------
# 执行后端
# ---------------------------------------------------------------------------
# DeepAgents 执行后端（filesystem: 文件系统, sandbox: 沙箱, composite: 组合）。
backend:
  type: filesystem
  filesystem:
    root_dir: /
  sandbox:
    provider: local
    timeout_seconds: 60
    mounts: []

# ---------------------------------------------------------------------------
# 记忆系统
# ---------------------------------------------------------------------------
# 跨会话持久化记忆，用于个性化。
# DeepAgents 原生 MemoryMiddleware 会加载 storage_path 指向的 AGENTS.md 文件，
# 并将其内容注入到 system prompt 中。Agent 可以通过 edit_file 工具更新该文件。
memory:
  enabled: true
  storage_path: ./data/AGENTS.md

# ---------------------------------------------------------------------------
# 子 Agent
# ---------------------------------------------------------------------------
# 启用子 agent 委托，用于复杂多步骤任务。
subagents:
  enabled: true
  max_concurrent: 3
  timeout_seconds: 900

# 定义主 agent 可通过 task 工具委托的子 agent。
subagent_definitions:
  items:
    - name: researcher
      description: "从各种来源搜索和综合信息"
      system_prompt: "你是一名研究助手。查找相关信息，引用来源，并清晰地综合发现。"
      # model: "openai:gpt-4o-mini"  # 可选的模型覆盖
      # tools: ["search", "read_file"]  # 可选的工具白名单
      # skills: ["./plugins/skills/research"]  # 可选的技能路径
      enabled: true
    - name: coder
      description: "编写、审查和调试代码"
      system_prompt: "你是一名资深软件工程师。编写清晰、可测试的代码。使用可用的文件工具读写代码。"
      enabled: true
    - name: reviewer
      description: "检查 bug、风格和可维护性"
      system_prompt: "你是一名严格的代码审查员。仔细阅读代码，检查 bug、风格、类型注解、异常处理、文档、测试覆盖和可维护性。用 Markdown 输出发现清单，每条包含位置、描述和建议。"
      tools: ["read_file", "list_files", "run_ruff", "explain_symbol"]
      enabled: true
    - name: tester
      description: "生成并运行测试"
      system_prompt: "你是一名测试工程师。阅读代码后，为关键路径编写 pytest 单元测试，写入 tests/ 目录，然后运行测试并报告结果。调用 run_pytest 时，请优先传入具体的测试文件或目录（例如 tests/test_module.py 或 tests/plugins/），避免直接运行整个 tests/ 树，以防递归或长时间运行。"
      tools: ["read_file", "run_pytest", "write_file"]
      enabled: true
    - name: refactorer
      description: "提出并应用重构建议"
      system_prompt: "你是一名重构专家。根据审查意见，编写修改后的文件版本，使用 generate_patch 生成统一 diff，并在用户确认后使用 write_file 应用修改。"
      tools: ["read_file", "explain_symbol", "generate_patch", "write_file"]
      enabled: true

# ---------------------------------------------------------------------------
# 通道（即时通讯平台集成）
# ---------------------------------------------------------------------------
# 配置外部消息平台以与 agent 交互。
channels:
  langgraph_url: http://localhost:8000/api
  gateway_url: http://localhost:8000

  # 飞书集成
  feishu:
    enabled: false
    app_id: $FEISHU_APP_ID
    app_secret: $FEISHU_APP_SECRET

  # Slack 集成
  slack:
    enabled: false
    bot_token: $SLACK_BOT_TOKEN
    app_token: $SLACK_APP_TOKEN

# ---------------------------------------------------------------------------
# 链路追踪
# ---------------------------------------------------------------------------
# 通过 LangSmith 或 Langfuse 实现可观测性。
tracing:
  enabled: false
  providers: []  # 例如：["langsmith", "langfuse"]

# ---------------------------------------------------------------------------
# 网关配置
# ---------------------------------------------------------------------------
gateway:
  host: 0.0.0.0
  port: 8000
  enable_docs: true

# ---------------------------------------------------------------------------
# 数据库配置
# ---------------------------------------------------------------------------
# 默认使用 SQLite，生产环境可设置为 "postgres"。
database:
  backend: sqlite
  sqlite_dir: ./data

